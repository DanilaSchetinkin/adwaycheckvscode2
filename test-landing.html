<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Landing</title>
    
    <!-- jQuery 3.6.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" referrerpolicy="no-referrer"></script>
    
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Landing Page</h1>
        
        <span id="oneform"></span>
        
        <form action="/order.php" method="post">
            <input type="hidden" name="fbpx" value="{fbpx}">
            <input type="hidden" name="utm_code" value="{subid}">
            <input type="hidden" name="cid" value="{campaign_id}">
            <input type="hidden" name="sid" value="HU123">
            <input type="hidden" name="hash" value="{hash}">
            <input type="hidden" name="country" value="HU">
            
            <input type="text" name="name" placeholder="Név" required>
            <input type="tel" name="phone" placeholder="Telefonszám" required>
            
            <button type="submit">Megrendelés</button>
        </form>
    </div>
    
    <!-- Обязательные скрипты -->
    <script async>
        const LAZY = document.querySelectorAll('img');
        for (let i = 0; i < LAZY.length; i++) {
            LAZY[i].setAttribute('loading', 'lazy');
        }
    </script>
    
    <script>
        $("a").on("touchend, click", function (e) {
            e.preventDefault();
            $('body,html').animate({
                scrollTop: $('#oneform').offset().top
            }, 400);
        });
    </script>
    
    <script>
        $('[name="name"]').on("input", function () {
            var val = $(this).val();
            var cleaned = val
                .replace(/[^\p{L}\s]/gu, "")
                .replace(/^\s+/, "")
                .replace(/\s\s+/, " ");
            var parts = cleaned.split(" ");
            if (parts.length > 2) {
                cleaned = parts[0] + " " + parts[1];
            }
            $(this).val(cleaned);
        });
        $('[name="name"]').on("change blur", function () {
            $(this).val($(this).val().trim());
        });
        $('[name="phone"]').on("input change", function (e) {
            var val = $(this).val();
            $(this).val(val.replace(/\D/g, ""));
            $(e.currentTarget).attr("pattern", "[0-9]{6,}");
        });
    </script>
</body>
</html>
